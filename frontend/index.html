<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Top Banner -->
    <header class="top-banner">
        <h1>Welcome To Quantity Measurement</h1>
        <button id="logout-btn" class="logout-btn hidden">Log Out</button>
    </header>

    <div class="main-container">
        <!-- Auth Section -->
        <section id="auth-section" class="auth-box">
            <h2>Sign In Required</h2>
            <p>Please sign in with your Google account to use the tool.</p>
            <a href="http://localhost:8080/oauth2/authorization/google" class="btn google-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                    <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                        <path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/>
                        <path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.369 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/>
                        <path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/>
                        <path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.109 -17.884 43.989 -14.754 43.989 Z"/>
                    </g>
                </svg>
                Sign in with Google
            </a>
        </section>

        <!-- App Section -->
        <section id="app-section" class="hidden">
            
            <div class="section-title">CHOOSE TYPE</div>
            <div class="category-cards">
                <div class="card cat-card active" data-cat="LENGTH">
                    <div class="icon length-icon">📐</div>
                    <span>Length</span>
                </div>
                <div class="card cat-card" data-cat="WEIGHT">
                    <div class="icon weight-icon">⚖️</div>
                    <span>Weight</span>
                </div>
                <div class="card cat-card" data-cat="TEMPERATURE">
                    <div class="icon temp-icon">🌡️</div>
                    <span>Temperature</span>
                </div>
                <div class="card cat-card" data-cat="VOLUME">
                    <div class="icon vol-icon">🥛</div>
                    <span>Volume</span>
                </div>
            </div>

            <div class="section-title">CHOOSE ACTION</div>
            <div class="action-tabs">
                <button class="action-tab" data-action="compare">Comparison</button>
                <button class="action-tab active" data-action="convert">Conversion</button>
                <button class="action-tab" data-action="add">Arithmetic</button>
            </div>

            <!-- Main Input Area -->
            <div class="calculation-area">
                
                <!-- Value 1 -->
                <div class="input-block">
                    <label class="val-label">VALUE 1</label>
                    <div class="card input-card">
                        <input type="number" id="val1" value="1" step="any">
                        <select id="unit1" class="unit-dropdown"></select>
                    </div>
                </div>

                <!-- Operator (Hidden for Conversion) -->
                <div id="operator-block" class="operator-block hidden">
                    <div class="card op-card" id="operator-toggle">+</div>
                </div>

                <!-- Value 2 (Hidden for Conversion) -->
                <div id="val2-block" class="input-block hidden">
                    <label class="val-label">VALUE 2</label>
                    <div class="card input-card">
                        <input type="number" id="val2" value="1" step="any">
                        <select id="unit2" class="unit-dropdown"></select>
                    </div>
                </div>

            </div>

            <!-- Result Area -->
            <div class="result-block">
                <label class="val-label">RESULT</label>
                <div class="card result-card">
                    <div id="result-val" class="result-value">1.000</div>
                    <select id="target-unit" class="unit-dropdown"></select>
                </div>
            </div>

        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
