server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:mysql://qma-mysql-db-tanmaylohakare820-0a6c.k.aivencloud.com:10714/defaultdb?useSSL=true&trustServerCertificate=true}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
